services:
  japanese-freq:
    container_name: japanese_freq
    build: .
    depends_on:
      - mongodb
    env_file:
      - .env
    volumes:
      - ./output:/server/output
      - ./input:/server/input
      - ./dictionaries:/server/dictionaries
      - ./.ignorelist.json:/server/.ignorelist
    ports:
      - ${FLASK_PORT:-5000}:5000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${FLASK_PORT:-5000}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal_net

  mongodb:
    image: mongo:8.0.8
    container_name: mongodb
    volumes:
      - mongo_data:/data/db
    ports:
      - ${MONGO_PORT:-27017}:27017
    networks:
      - internal_net

volumes:
  mongo_data:


networks:
  internal_net:
