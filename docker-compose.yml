services:
  japanese-freq:
    container_name: japanese_freq
    build: .
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./input:/app/input
      - ./dictionaries:/app/dictionaries
      - ./.ignorelist.json:/app/.ignorelist
    ports:
      - ${FLASK_PORT:-5000}:5000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${FLASK_PORT:-5000}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
