services:
  japanese-freq:
    container_name: japanese_freq
    build: .
    env_file:
      - .env
    volumes:
      - ./output:/usr/src/app/output
      - ./input:/usr/src/app/input
      - ./dictionaries:/usr/src/app/dictionaries
      - ./.ignorelist.json:/usr/src/app/.ignorelist
    ports:
      - ${FLASK_PORT:-5000}:5000
