services:
  japanese-freq:
    container_name: japanese_freq
    build: .
    env_file:
      - .env
    volumes:
      - ./output:/server/output
      - ./input:/server/input
      - ./dictionaries:/server/dictionaries
      - ./.ignorelist.json:/server/.ignorelist
    ports:
      - ${FLASK_PORT:-5000}:5000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${FLASK_PORT:-5000}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
