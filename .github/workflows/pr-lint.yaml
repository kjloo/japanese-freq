name: PR Lint

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.2.0"

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run client lint
        run: make client/lint
